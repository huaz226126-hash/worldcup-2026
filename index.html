<!DOCTYPE html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>2026世界杯 · 观测站</title><style>* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0a0e17;
  --card: #131a2b;
  --card-hover: #1a2440;
  --gold: #f0c040;
  --gold-dim: #b8962f;
  --text: #e8e8e8;
  --text-dim: #8892a4;
  --green: #00c853;
  --red: #ff3d3d;
  --blue: #448aff;
  --tab-bg: #1a2440;
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}
#app { max-width: 480px; margin: 0 auto; padding: 0; }

/* Header */
header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, #0a0e17 0%, #0f1625 100%);
  border-bottom: 1px solid rgba(240,192,64,0.15);
  padding: 12px 16px 0;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
h1 { font-size: 20px; font-weight: 700; color: var(--gold); }
h1 .icon { margin-right: 6px; }
.live-dot { font-size: 11px; color: var(--green); font-weight: 600; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* Tabs */
.tabs {
  display: flex; gap: 2px;
  background: var(--tab-bg); border-radius: 10px; padding: 3px;
  margin-bottom: 0;
}
.tab {
  flex: 1; padding: 10px 8px; border: none; border-radius: 8px;
  background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.tab.active { background: var(--gold); color: #0a0e17; }
.tab:not(.active):hover { color: var(--text); }

/* Main */
main { padding: 12px 16px; }

/* Loading */
.loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 0; gap: 16px;
}
.loading p { color: var(--text-dim); font-size: 14px; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--tab-bg); border-top-color: var(--gold);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Match Cards */
.match-card {
  background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.04);
}
.match-card:hover { background: var(--card-hover); }
.match-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; font-size: 11px; color: var(--text-dim);
}
.match-status {
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
}
.match-status.ft { background: rgba(0,200,83,0.15); color: var(--green); }
.match-status.live { background: rgba(255,61,61,0.15); color: var(--red); animation: pulse 1s infinite; }
.match-status.ns { background: rgba(68,138,255,0.15); color: var(--blue); }
.match-teams {
  display: flex; align-items: center; gap: 8px;
}
.team-badge { width: 28px; height: 28px; object-fit: contain; border-radius: 50%; }
.team-name { flex: 1; font-size: 14px; font-weight: 600; }
.team-name.right { text-align: right; }
.score {
  font-size: 22px; font-weight: 800; color: var(--gold);
  min-width: 48px; text-align: center; font-variant-numeric: tabular-nums;
}
.match-info { font-size: 11px; color: var(--text-dim); margin-top: 8px; }

/* Section titles */
.section-title {
  font-size: 14px; font-weight: 700; color: var(--gold-dim);
  margin: 16px 0 10px; padding-left: 4px;
}

/* Date group */

.date-header {
  font-size: 12px; color: var(--text-dim); padding: 8px 4px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 8px;
}

  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;

.team-card {
  background: var(--card); border-radius: var(--radius);
  padding: 14px; text-align: center; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.04); transition: all .2s;

.team-card img { width: 44px; height: 44px; object-fit: contain; margin-bottom: 8px; }
.team-card .name { font-size: 13px; font-weight: 600; }
.team-card .record { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* Prediction bars */
.prediction-bar {
  display: flex; height: 28px; border-radius: 6px; overflow: hidden;
  margin: 10px 0; font-size: 11px; font-weight: 700;
}
.pred-bar-home { background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; }
.pred-bar-draw { background: var(--text-dim); color: #fff; display: flex; align-items: center; justify-content: center; }
.pred-bar-away { background: var(--gold); color: #0a0e17; display: flex; align-items: center; justify-content: center; }

/* Odds table */
.odds-table { width: 100%; border-collapse: collapse; }
.odds-table th {
  font-size: 11px; color: var(--text-dim); padding: 6px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.06); text-align: center;
}
.odds-table th:first-child, .odds-table td:first-child { text-align: left; }
.odds-table td {
  padding: 8px 4px; font-size: 13px; text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.odds-table .team-cell {
  display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
}
.odds-table .team-cell img { width: 20px; height: 20px; border-radius: 50%; }
.odds-value { font-weight: 700; color: var(--gold); }

/* Footer */
footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(10,14,23,0.95); border-top: 1px solid rgba(240,192,64,0.1);
  padding: 10px 16px; text-align: center;
}
footer p { font-size: 10px; color: var(--text-dim); }

/* Error */
.error { color: var(--red); text-align: center; padding: 40px 0; font-size: 14px; }

/* Modal for team detail */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-content {
  background: var(--card); border-radius: 16px 16px 0 0; width: 100%; max-width: 480px;
  padding: 20px; max-height: 80vh; overflow-y: auto;
}
.modal-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.modal-header img { width: 48px; height: 48px; border-radius: 50%; }
.modal-header h2 { font-size: 18px; color: var(--gold); }
.modal-close {
  margin-left: auto; background: var(--tab-bg); border: none;
  color: var(--text); width: 32px; height: 32px; border-radius: 50%;
  font-size: 18px; cursor: pointer;
}
.modal-body p { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 8px; }
.modal-body .info-row {
  display: flex; justify-content: space-between; padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
}
.modal-body .info-label { color: var(--text-dim); }
.modal-body .info-value { color: var(--text); font-weight: 600; }
/* Score Prediction */
.score-prediction {
  display: flex; align-items: center; gap: 8px;
  background: rgba(240,192,64,0.08); border-radius: 8px;
  padding: 8px 12px; margin: 6px 0 8px;
}
.pred-score {
  font-size: 24px; font-weight: 800; color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.pred-label {
  font-size: 11px; color: var(--text-dim);
}
.pred-conf {
  margin-left: auto; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 10px;
}
.conf-high { background: rgba(0,200,83,0.15); color: var(--green); }
.conf-med { background: rgba(240,192,64,0.15); color: var(--gold); }
.conf-low { background: rgba(255,61,61,0.15); color: var(--red); }

/* Analysis text */
.analysis-text {
  font-size: 11px; color: var(--text-dim); line-height: 1.6;
  margin-top: 6px; padding: 8px; background: rgba(255,255,255,0.02);
  border-radius: 6px;
}

/* Odds Explainer */
.odds-explainer {
  background: rgba(240,192,64,0.06);
  border: 1px solid rgba(240,192,64,0.12);

  padding: 10px 12px;
  margin-bottom: 10px;
}
.odds-explainer p { font-size: 12px; color: #8892a4; margin-bottom: 8px; }
.odds-example { display: flex; gap: 6px; }
.odds-example span { flex: 1; text-align: center; padding: 4px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.ex-home { background: rgba(68,138,255,0.12); color: #448aff; }
.ex-draw { background: rgba(136,146,164,0.12); color: #8892a4; }
.ex-away { background: rgba(240,192,64,0.12); color: #f0c040; }
.odds-pct { font-size: 10px; color: #8892a4; font-weight: 400; }
.odds-rec { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.rec-home { background: rgba(68,138,255,0.15); color: #448aff; }
.rec-draw { background: rgba(136,146,164,0.15); color: #8892a4; }
.rec-away { background: rgba(240,192,64,0.15); color: #f0c040; }

/* Team Chinese name */
.team-cn { font-size:10px; color:#8892a4; font-weight:400; display:block; }
</style></head><body><div id=app><header><div class=header-top><h1><span class=icon>🏆</span> 2026 世界杯</h1><span class=live-dot>● 实时</span></div><nav class=tabs id=tabs><button class="tab active" data-tab=matches>比赛</button><button class=tab data-tab=teams>球队</button><button class=tab data-tab=predictions>预测</button><button class=tab data-tab=odds>指数</button></nav></header><main id=main-content><div class=loading><div class=spinner></div><p>加载中...</p></div></main><footer><p>数据来源: TheSportsDB | 每5分钟自动刷新</p></footer></div><script>async function fetchJSON(url) {

function showLoading() {
  document.getElementById("main-content").innerHTML = '<div class="loading"><div class="spinner"></div><p>鍔犺浇涓?..</p></div>';
}

function showError(msg) {
  document.getElementById("main-content").innerHTML = '<div class="error">' + msg + '<br><br><button onclick="loadTab(currentTab)" style="background:var(--gold);border:none;padding:8px 20px;border-radius:6px;color:#0a0e17;font-weight:700;cursor:pointer;">閲嶈瘯</button></div>';
}

async function loadTab(tab) {
  showLoading();
  try {
    await loadAllData();
    switch(tab) {
      case "matches": renderMatches(); break;
      case "teams": renderTeams(); break;
      case "predictions": renderPredictions(); break;
      case "odds": renderOdds(); break;
    }
  } catch(e) {
    showError("鍔犺浇澶辫触: " + e.message);
  }
}

function getStatusLabel(m) {
  var st = m.strStatus || "NS";
  if (st === "FT") return { label: "宸茬粨鏉?, cls: "ft" };
  if (st === "LIVE") return { label: "杩涜涓?, cls: "live" };
  return { label: "鏈紑濮?, cls: "ns" };
}

// ---- Team strength calculation ----
function calcTeamStrength(team) {
  if (!team) return 5;
  var score = 5;
  // Older formed teams = more established
  var age = 2026 - parseInt(team.intFormedYear || 2000);
  score += Math.min(3, Math.round(age / 30));
  // Country prestige proxy
  var country = (team.strCountry || "").toLowerCase();
  var powerCountries = ["brazil","argentina","germany","france","italy","spain","england","netherlands","uruguay"];
  if (powerCountries.includes(country)) score += 2;
  var strongCountries = ["portugal","belgium","croatia","colombia","mexico","japan","south korea","usa","senegal","morocco","switzerland","denmark","sweden","poland","australia","ghana","ivory coast","nigeria","cameroon","ecuador","peru","chile","paraguay"];
  if (strongCountries.includes(country)) score += 1;
  return Math.min(10, Math.max(1, score));
}

// ---- Score prediction ----
function predictScore(homeStr, awayStr) {
  var scorePairs = [
    { s: "1-0", w: 15 }, { s: "2-0", w: 12 }, { s: "2-1", w: 15 },
    { s: "1-1", w: 18 }, { s: "0-0", w: 8 },  { s: "0-1", w: 12 },
    { s: "0-2", w: 10 }, { s: "1-2", w: 12 }, { s: "3-1", w: 6 },
    { s: "3-0", w: 5 },  { s: "0-3", w: 4 },  { s: "2-2", w: 6 },
    { s: "1-3", w: 4 },  { s: "3-2", w: 4 },  { s: "4-1", w: 2 },
    { s: "4-0", w: 2 },  { s: "0-4", w: 2 },
  ];
  
  var totalStr = homeStr + awayStr;
  var bias = (homeStr - awayStr) / totalStr; // -1 to 1
  
  var weighted = [];
  for (var i = 0; i < scorePairs.length; i++) {
    var sp = scorePairs[i];
    var parts = sp.s.split("-");
    var hg = parseInt(parts[0]);
    var ag = parseInt(parts[1]);
    var diff = hg - ag;
    // Adjust weight based on team strength bias
    var adj = sp.w + (bias * diff * 5);
    if (adj < 0) adj = 0;
    weighted.push({ score: sp.s, weight: adj, home: hg, away: ag });
  }
  
  // Random pick weighted
  var totalWeight = 0;
  for (var i = 0; i < weighted.length; i++) totalWeight += weighted[i].weight;
  var r = Math.random() * totalWeight;
  var cum = 0;
  for (var i = 0; i < weighted.length; i++) {
    cum += weighted[i].weight;
    if (r <= cum) {
      return { score: weighted[i].score, home: weighted[i].home, away: weighted[i].away };
    }
  }
  return { score: "1-1", home: 1, away: 1 };
}

// ---- Generate analysis text ----
function generateAnalysis(team, opponent, homeStr, awayStr, hScore, aScore) {
  var diff = homeStr - awayStr;
  var analysis = [];
  var hName = team ? (team.strTeam || "涓婚槦") : "涓婚槦";

  var hCountry = team ? (team.strCountry || "") : "";
  var aCountry = opponent ? (opponent.strCountry || "") : "";
  
  // Team analysis
  if (diff > 2) {

    analysis.push(aName + "闈复寮哄ぇ鍘嬪姏锛岄渶绋冲浐闃插畧瀵绘壘鍙嶅嚮鏈轰細");
  } else if (diff > 0) {
    analysis.push(hName + "瀹炲姏绋嶅崰涓婇锛屼富鍦烘皵鍔挎椇鐩?);
    analysis.push(aName + "鍏峰涓€瀹氭姉琛¤兘鍔涳紝姣旇禌涓嶄細杞绘澗");
  } else if (diff > -2) {
    analysis.push(aName + "瀹炲姏鐣ュ己浜庡鎵嬶紝浣嗘瘮璧涘厖婊″彉鏁?);
    analysis.push(hName + "鍧愭嫢涓诲満涔嬪埄锛屾湁鏈涘埗閫犳儕鍠?);
  } else {
    analysis.push(aName + "鏁翠綋瀹炲姏鏄庢樉鍗犱紭锛岃儨闈㈣緝澶?);
    analysis.push(hName + "闇€瓒呮按骞冲彂鎸ユ墠鏈夊彲鑳芥嬁鍒?);
  }
  
  // Score analysis
  var total = hScore + aScore;
  if (total >= 4) {
    analysis.push("棰勮灏嗘槸涓€鍦鸿繘鐞冨ぇ鎴?);
  } else if (total >= 2) {
    analysis.push("棰勮鍙屾柟閮芥湁鏈轰細鐮撮棬");
  } else {
    analysis.push("棰勮鍦洪潰杈冧负璋ㄦ厧锛岃繘鐞冧笉浼氬お澶?);
  }
  
  // Prestige check
  var prestigeKeys = ["brazil","argentina","germany","france","italy","spain","england","netherlands"];
  var hPrestige = prestigeKeys.some(function(k) { return hCountry.toLowerCase().includes(k); });
  var aPrestige = prestigeKeys.some(function(k) { return aCountry.toLowerCase().includes(k); });
  if (hPrestige && aPrestige) {
    analysis.push("涓ゆ敮浼犵粺璞棬瀵瑰喅锛岀粡鍏镐箣鎴樺€煎緱鏈熷緟");
  } else if (hPrestige || aPrestige) {
    analysis.push(hPrestige ? hName : aName + "浣滀负浼犵粺璞棬锛屽ぇ璧涚粡楠屼赴瀵?);
  }
  
  return analysis.join(" | ");
}

// ---- Confidence level ----
function getConfidence(homeStr, awayStr) {
  var diff = Math.abs(homeStr - awayStr);
  if (diff >= 4) return { level: "楂?, cls: "high" };
  if (diff >= 2) return { level: "涓?, cls: "med" };
  return { level: "浣?, cls: "low" };
}

// ---- Matches ----
function renderMatches() {
  var groups = {};
  for (var i = 0; i < matchesCache.length; i++) {
    var m = matchesCache[i];
    var d = m.dateEvent || "鏈煡鏃ユ湡";
    if (!groups[d]) groups[d] = [];
    groups[d].push(m);
  }
  var dates = Object.keys(groups).sort();
  var today = new Date();
  var todayStr = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
  var html = '<div class="section-title">\u{1F3C6} \u8D5B\u7A0B\u4E0E\u7ED3\u679C</div>';
  for (var di = 0; di < dates.length; di++) {
    var date = dates[di];
    var matches = groups[date];
    var d = new Date(date);
    var weekdays = ["鏃?,"涓€","浜?,"涓?,"鍥?,"浜?,"鍏?];
    var wd = weekdays[d.getDay()];
    var isToday = date === todayStr;
    var dateLabel = isToday ? "\u{1F534} \u4ECA\u5929 " + date : date + " \u5468" + wd;
    html += '<div class="date-group"><div class="date-header">' + dateLabel + '</div>';
    for (var mi = 0; mi < matches.length; mi++) {
      var m = matches[mi];
      var st = getStatusLabel(m);
      var score = (m.intHomeScore !== null && m.intAwayScore !== null) ? m.intHomeScore + "-" + m.intAwayScore : "vs";
      var roundText = m.intRound ? "\u7B2C" + m.intRound + "\u8F6E" : "";
      var timeText = m.strTime ? m.strTime.slice(0,5) : "";
      html += '<div class="match-card">';
      html += '<div class="match-header"><span>' + (m.strVenue || "") + '</span><span class="match-status ' + st.cls + '">' + st.label + '</span></div>';
      html += '<div class="match-teams">';
      html += '<img class="team-badge" src="' + (m.strHomeTeamBadge || "") + '" alt="" onerror="this.style.display=\'none\'">';
      html += '<span class="team-name">' + m.strHomeTeam + '</span>';
      html += '<span class="score">' + score + '</span>';
      html += '<span class="team-name right">' + m.strAwayTeam + '</span>';
      html += '<img class="team-badge" src="' + (m.strAwayTeamBadge || "") + '" alt="" onerror="this.style.display=\'none\'">';
      html += '</div>';
      html += '<div class="match-info">' + timeText + (timeText && roundText ? " | " : "") + roundText + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  document.getElementById("main-content").innerHTML = html;
}

// ---- Teams ----
function renderTeams() {

    document.getElementById("main-content").innerHTML = '<div class="error">鏆傛棤鐞冮槦鏁版嵁</div>';

  }
  var html = '<div class="section-title">\u{1F3C6} \u53C2\u8D5B\u7403\u961F</div><div class="teams-grid">';
  for (var i = 0; i < list.length; i++) {
    var id = list[i][0];
    var t = list[i][1];
    var badge = t.strBadge || t.strLogo || "";
    var country = t.strCountry || "";

// ---- Squad Generator ----
function generateSquad(team, strength) {
  var positions = [];
  for (var i = 0; i < 3; i++) positions.push("\u95E8\u5C06");
  for (var i = 0; i < 8; i++) positions.push("\u540E\u536B");
  for (var i = 0; i < 8; i++) positions.push("\u4E2D\u573A");
  for (var i = 0; i < 4; i++) positions.push("\u524D\u950B");
  var posDescs = {"\u95E8\u5C06":"\u53CD\u5E94\u8FC5\u901F","\u540E\u536B":"\u8EAB\u4F53\u5F3A\u58EE","\u4E2D\u573A":"\u7EC4\u7EC7\u8FDB\u653B","\u524D\u950B":"\u95E8\u524D\u654F\u611F"};
  var country = (team.strCountry || "");
  var clubs = TOP_CLUBS[country] || ["\u672C\u571F\u4FF1\u4E50\u90E8"];
  var squad = [];
  var baseValue = strength * 100;
  for (var i = 0; i < positions.length; i++) {
    var pos = positions[i];
    var posVal = pos === "\u524D\u950B" ? 1.5 : pos === "\u4E2D\u573A" ? 1.2 : pos === "\u95E8\u5C06" ? 0.8 : 1.0;
    var value = Math.round(baseValue * posVal * (0.5 + Math.random() * 0.8));
    var club = clubs[Math.floor(Math.random() * clubs.length)];
    var pnum = i + 1;
    var label = pnum <= 11 ? "棣栧彂" : "鏇胯ˉ";
    if (pos === "\u95E8\u5C06" && i >= 2) label = "鏇胯ˉ";
    squad.push({ number: pnum, position: pos, club: club, value: value, label: label, desc: posDescs[pos] });
  }
  return squad;
}

    var bgColor = sp.label === '棣栧彂' ? 'rgba(0,200,83,0.15)' : 'rgba(136,146,164,0.15)';
    var textColor = sp.label === '棣栧彂' ? '#00c853' : '#8892a4';
    html += '<tr style="border-bottom:1px solid rgba(255,255,255,0.02)">' +
      '<td style="padding:4px;text-align:center;color:#8892a4">' + sp.number + '</td>' +
      '<td style="padding:4px">' + sp.position + '<br><span style="font-size:9px;color:#8892a4">' + sp.desc + '</span></td>' +
      '<td style="padding:4px;font-size:10px">' + sp.club + '</td>' +
      '<td style="padding:4px;text-align:right;color:var(--gold);font-weight:700">' + valDisplay + '</td>' +
      '<td style="padding:4px;text-align:center"><span style="font-size:10px;padding:1px 6px;border-radius:3px;background:' + bgColor + ';color:' + textColor + '">' + sp.label + '</span></td>' +
    '</tr>';
  }
  html += '</tbody></table></div>' +
    (t.strDescriptionEN ? '<p style="margin-top:12px;font-size:12px;color:#8892a4;line-height:1.6">' + t.strDescriptionEN.slice(0,300) + '...</p>' : '') +
    '</div></div>';
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = html;
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

</script></body></html>
